name: Build and push Docker image

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Matches the supported LTS runtime used by the Dockerfile
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  validate-truenas-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate with the official TrueNAS renderer
        shell: bash
        run: |
          git clone --depth 1 https://github.com/truenas/apps.git "$RUNNER_TEMP/truenas-apps"
          cp -R truenas-app/ix-dev/community/byb-budget "$RUNNER_TEMP/truenas-apps/ix-dev/community/byb-budget"
          cd "$RUNNER_TEMP/truenas-apps"
          python .github/scripts/ci.py \
            --app byb-budget \
            --train community \
            --test-file basic-values.yaml \
            --render-only=true

  build-and-push:
    # No image is published unless the suite above is green
    needs: [test, validate-truenas-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read app version
        id: app
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/johnrbrady/byb-budget:latest
            ghcr.io/johnrbrady/byb-budget:${{ steps.app.outputs.version }}
            ghcr.io/johnrbrady/byb-budget:${{ github.sha }}
